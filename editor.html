<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scene Editor</title>
    <style>
      :root {
        color-scheme: dark;
        font: 13px system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #e5e7eb;
      }
      body {
        display: grid;
        grid-template: "top top top" auto "list view inspector" 1fr / 200px 1fr 280px;
      }
      #topbar {
        grid-area: top;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px;
        background: #1f2937;
      }
      #entities {
        grid-area: list;
        overflow: auto;
        padding: 8px;
        background: #18181b;
      }
      #view {
        grid-area: view;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      #inspector {
        grid-area: inspector;
        overflow: auto;
        padding: 8px;
        background: #18181b;
      }
      canvas {
        background: #222;
        max-width: 100%;
        max-height: 100%;
        touch-action: none;
      }
      ul {
        list-style: none;
        margin: 8px 0;
        padding: 0;
      }
      li {
        padding: 4px 6px;
        border-radius: 3px;
        cursor: pointer;
      }
      li:hover {
        background: #27272a;
      }
      li.selected {
        background: #2563eb;
      }
      .status.error {
        color: #f87171;
      }
      section.component {
        border-top: 1px solid #333;
        padding: 6px 0;
      }
      section.component h3 {
        display: flex;
        justify-content: space-between;
        margin: 4px 0;
        font-size: 13px;
      }
      label.row {
        display: grid;
        grid-template-columns: 80px 1fr;
        gap: 6px;
        align-items: center;
        margin: 3px 0;
      }
      input,
      select,
      button {
        font: inherit;
      }
      input[type="text"],
      input[type="number"],
      select {
        min-width: 0;
      }
      .color {
        display: flex;
        gap: 4px;
      }
      .color {
        min-width: 0;
      }
      .color input[type="text"] {
        flex: 1;
        width: 0;
      }
      .color input[type="color"] {
        flex: none;
        width: 32px;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <header id="topbar"></header>
    <aside id="entities"></aside>
    <main id="view"><canvas id="viewport"></canvas></main>
    <aside id="inspector"></aside>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
