<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Performance</title>
    <style>
      :root {
        color-scheme: dark;
        font: 13px system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #e5e7eb;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr;
      }
      #topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        background: #18181b;
        border-bottom: 1px solid #333;
      }
      #topbar label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #71717a;
      }
      .status.live::before {
        background: #4ade80;
      }
      .status.stalled::before {
        background: #facc15;
      }
      .status.stopped::before {
        background: #f87171;
      }
      #info {
        color: #a1a1aa;
      }
      #message {
        color: #f87171;
      }
      input,
      select,
      button {
        font: inherit;
      }
      #charts {
        overflow: auto;
        padding: 8px 12px;
      }
      .empty {
        margin: 48px auto;
        max-width: 480px;
        text-align: center;
        color: #a1a1aa;
      }
      .chart {
        margin-bottom: 12px;
      }
      .chart h3 {
        display: flex;
        justify-content: space-between;
        margin: 0 0 4px;
        font-size: 13px;
        font-weight: 600;
      }
      .chart h3 .summary {
        font-weight: normal;
        color: #a1a1aa;
      }
      .chart canvas {
        display: block;
        width: 100%;
        height: 150px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <header id="topbar">
      <span id="status" class="status"></span>
      <label>Show <select id="range"></select></label>
      <label><input id="inputs" type="checkbox" checked /> Key presses</label>
      <button id="pause">Pause</button>
      <button id="clear">Clear</button>
      <button id="save">Save as CSV</button>
      <span id="info"></span>
    </header>
    <main id="charts"></main>
    <script type="module" src="/src/live-perf/main.ts"></script>
  </body>
</html>
